# ビルドスクリプトの明示的な扱い(strictDepBuilds: true のため未承認ビルドはエラーになる)。
# sharp は next/image の実行時最適化用。本アプリは next/image の最適化を使わないため
# ネイティブビルドは不要 → false(ビルドしないことを明示的に承認)。
packages:
  - "."

allowBuilds:
  core-js: false
  msw: false
  sharp: false
  # better-sqlite3: drizzle-kit pull のスキーマ取り込み専用(実行時は node:sqlite を使うため
  # アプリには含まれない)。prebuild-install でプリビルドバイナリを取得するだけで
  # コンパイラは不要(node:22-slim での Docker ビルドで確認済み)。
  better-sqlite3: true
  # esbuild: drizzle-kit の transitive dependency。postinstall はプラットフォーム別バイナリの
  # ダウンロードのみ(コンパイル不要)。
  esbuild: true

blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 10080
packageManagerStrictVersion: true
strictDepBuilds: true
trustPolicy: no-downgrade
verifyDepsBeforeRun: error
